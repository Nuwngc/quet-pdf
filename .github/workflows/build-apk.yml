name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Tải thư viện để app chạy offline
        run: |
          mkdir -p www/lib
          B=https://cdnjs.cloudflare.com/ajax/libs
          curl -fsSL $B/jspdf/2.5.1/jspdf.umd.min.js -o www/lib/jspdf.umd.min.js
          curl -fsSL $B/pdf.js/3.11.174/pdf.min.js -o www/lib/pdf.min.js
          curl -fsSL $B/pdf.js/3.11.174/pdf.worker.min.js -o www/lib/pdf.worker.min.js
      - run: npm install
      - run: npx cap add android
      - name: Cấp quyền camera
        run: |
          sed -i 's#<application#<uses-permission android:name="android.permission.CAMERA" />\n    <uses-feature android:name="android.hardware.camera" android:required="false" />\n    <application#' android/app/src/main/AndroidManifest.xml
      - run: npx cap sync android
      - name: Build APK
        run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - name: Phát hành APK
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk QuetPDF.apk
          gh release delete latest -y --cleanup-tag || true
          gh release create latest QuetPDF.apk --title "Quét PDF (bản mới nhất)" --notes "Tải QuetPDF.apk rồi cài đặt."
