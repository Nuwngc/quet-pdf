<!doctype html>
<html lang="vi"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Quét &amp; PDF</title>
<style>
:root{--bg:#f4f5fb;--card:#fff;--tx:#1a1c2b;--mu:#6a6f88;--ln:#e4e6f2;--ac:#5b5ff0;--ac2:#9b5cf6;--sh:0 6px 24px rgba(60,64,140,.10);color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1017;--card:#181b27;--tx:#eceef8;--mu:#9aa0ba;--ln:#272b3b;--sh:0 6px 24px rgba(0,0,0,.4);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0e1017;--card:#181b27;--tx:#eceef8;--mu:#9aa0ba;--ln:#272b3b;--sh:0 6px 24px rgba(0,0,0,.4);color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px);background:var(--bg)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding-bottom:120px}
.wrap{max-width:560px;margin:0 auto;padding:16px}
.hero{background:linear-gradient(135deg,var(--ac),var(--ac2));color:#fff;border-radius:24px;padding:22px 20px;box-shadow:var(--sh)}
.hero h1{margin:0 0 4px;font-size:26px;letter-spacing:-.3px}.hero p{margin:0;opacity:.92;font-size:14px}
.acts{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px}
.act{background:var(--card);border:1px solid var(--ln);border-radius:20px;padding:16px 14px;text-align:left;color:var(--tx);font:inherit;box-shadow:var(--sh);cursor:pointer;transition:transform .12s}
.act:active{transform:scale(.97)}
.act.wide{grid-column:1/-1;display:flex;align-items:center;gap:14px}.act.wide b{margin-top:0}
.act b{display:block;font-size:16px;margin-top:10px}.act span{font-size:12.5px;color:var(--mu);line-height:1.3;display:block;margin-top:2px}
.ico{width:46px;height:46px;border-radius:15px;display:grid;place-items:center;font-size:23px;background:linear-gradient(135deg,var(--ac),var(--ac2))}
.steps{margin:22px 4px 0;display:grid;gap:12px;color:var(--mu);font-size:14.5px}
.steps div{display:flex;gap:12px;align-items:center}
.steps i{flex:none;width:28px;height:28px;border-radius:50%;background:var(--card);border:1px solid var(--ln);display:grid;place-items:center;font-style:normal;font-weight:700;color:var(--ac);font-size:13px}
.opts{margin-top:18px;background:var(--card);border:1px solid var(--ln);border-radius:20px;padding:14px;display:grid;gap:12px}
.row{display:flex;gap:10px;align-items:center;justify-content:space-between}
.lbl{font-size:13px;color:var(--mu);font-weight:600}
.seg{display:flex;background:var(--bg);border-radius:12px;padding:3px}
.seg button{border:0;background:none;color:var(--mu);font:inherit;font-size:14px;font-weight:600;padding:8px 14px;border-radius:10px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--card);color:var(--ac);box-shadow:0 1px 4px rgba(0,0,0,.12)}
input.nm{flex:1;min-width:0;border:1px solid var(--ln);background:var(--bg);color:var(--tx);border-radius:12px;padding:10px 12px;font:inherit;font-size:15px}
.hd{display:flex;justify-content:space-between;align-items:center;margin:20px 4px 10px;font-weight:700}
.hd button{border:0;background:none;color:#e5484d;font:inherit;font-size:14px;font-weight:600;padding:6px;cursor:pointer}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.card{background:var(--card);border:1px solid var(--ln);border-radius:18px;overflow:hidden;box-shadow:var(--sh)}
.th{position:relative;aspect-ratio:3/4;background:var(--bg);display:grid;place-items:center;cursor:pointer}
.th img{max-width:100%;max-height:100%;display:block}
.n{position:absolute;left:8px;top:8px;background:rgba(20,22,40,.72);color:#fff;font-size:12px;font-weight:700;min-width:24px;height:24px;border-radius:12px;display:grid;place-items:center;padding:0 7px}
.t{position:absolute;right:8px;bottom:8px;background:rgba(91,95,240,.9);color:#fff;font-size:11px;font-weight:600;padding:3px 8px;border-radius:10px}
.bar{display:flex;border-top:1px solid var(--ln)}
.bar button{flex:1;height:44px;border:0;background:none;color:var(--tx);font-size:19px;cursor:pointer}
.bar button:disabled{opacity:.25}.bar button:active{background:var(--bg)}
.bar .x{color:#e5484d}
.dock{position:fixed;left:0;right:0;bottom:0;padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));background:linear-gradient(transparent,var(--bg) 35%)}
.go{display:block;width:100%;max-width:528px;margin:0 auto;border:0;border-radius:18px;padding:16px;font:inherit;font-size:17px;font-weight:700;color:#fff;background:linear-gradient(135deg,var(--ac),var(--ac2));box-shadow:0 8px 24px rgba(91,95,240,.4);cursor:pointer}
.go:disabled{opacity:.6}
.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:#20223a;color:#fff;padding:10px 16px;border-radius:14px;font-size:14px;max-width:88%;text-align:center;z-index:5}
.lb{position:fixed;inset:0;background:rgba(8,9,18,.92);display:grid;place-items:center;z-index:9;padding:16px}
.lb img{max-width:100%;max-height:100%;border-radius:8px}
</style></head><body>
<div class="wrap">
  <div class="hero"><h1>📄 Quét &amp; PDF</h1><p>Chụp tài liệu hoặc chọn ảnh, gom thành một file PDF gọn đẹp.</p></div>
  <div class="acts">
    <button class="act" id="bCam"><div class="ico">📷</div><b>Quét tài liệu</b><span>Chụp bằng camera, tự làm rõ chữ</span></button>
    <button class="act" id="bPick"><div class="ico">🖼️</div><b>Ảnh sang PDF</b><span>Chọn nhiều ảnh từ thư viện</span></button>
    <button class="act wide" id="bPdf"><div class="ico">📑</div><div><b>Mở file PDF</b><span>Gộp, xóa, sắp xếp lại trang của PDF có sẵn</span></div></button>
  </div>
  <input type="file" id="cam" accept="image/*" capture="environment" hidden>
  <input type="file" id="pick" accept="image/*" multiple hidden>
  <input type="file" id="pdfIn" accept="application/pdf,.pdf" multiple hidden>

  <div class="steps" id="empty">
    <div><i>1</i>Chụp tài liệu hoặc chọn ảnh có sẵn</div>
    <div><i>2</i>Xoay, đổi bộ lọc, sắp xếp lại các trang</div>
    <div><i>3</i>Bấm Tạo PDF và lưu về máy</div>
  </div>

  <div id="tools" hidden>
    <div class="opts">
      <div class="row"><span class="lbl">Cỡ trang</span>
        <div class="seg" id="sz"><button data-v="a4" aria-pressed="true">A4</button><button data-v="fit" aria-pressed="false">Vừa ảnh</button></div></div>
      <div class="row"><span class="lbl">Tên file</span><input class="nm" id="nm" maxlength="60" placeholder="Tai-lieu"></div>
    </div>
    <div class="hd"><span id="cnt"></span><button id="clr">Xóa hết</button></div>
    <div class="grid" id="grid"></div>
  </div>
</div>
<div class="dock" id="dock" hidden><button class="go" id="go"></button></div>
<div class="toast" id="toast" hidden></div>
<div class="lb" id="lb" hidden><img alt="Xem trang"></div>

<script src="lib/jspdf.umd.min.js"></script>
<script>
const $=s=>document.querySelector(s);
const FN=['Gốc','Tài liệu','Trắng đen'], MAXD=1700;
let pages=[],uid=0,busy=false,size='a4',tt;

function toast(m){const t=$('#toast');t.textContent=m;t.hidden=false;clearTimeout(tt);tt=setTimeout(()=>t.hidden=true,2600)}

function loadImg(file){return new Promise((ok,no)=>{const u=URL.createObjectURL(file),i=new Image();
  i.onload=()=>{URL.revokeObjectURL(u);ok(i)};i.onerror=()=>{URL.revokeObjectURL(u);no()};i.src=u})}

async function add(files,f){
  let bad=0;
  for(const file of files){
    try{
      const img=await loadImg(file),W=img.naturalWidth,H=img.naturalHeight,s=Math.min(1,MAXD/Math.max(W,H));
      const c=document.createElement('canvas');c.width=Math.round(W*s);c.height=Math.round(H*s);
      c.getContext('2d').drawImage(img,0,0,c.width,c.height);
      pages.push({id:++uid,src:c,rot:0,f,th:null});
    }catch(e){bad++}
  }
  if(bad)toast('Có '+bad+' ảnh không đọc được');
  draw();
}

const lv=t=>t<=0?0:t>=1?255:t*255;
function enhance(c,x,mode){
  const W=c.width,H=c.height,b=document.createElement('canvas');
  b.width=Math.max(8,W>>4);b.height=Math.max(8,H>>4);
  const bx=b.getContext('2d');bx.imageSmoothingQuality='high';bx.drawImage(c,0,0,b.width,b.height);
  const o=document.createElement('canvas');o.width=W;o.height=H;
  const ox=o.getContext('2d',{willReadFrequently:true});ox.imageSmoothingQuality='high';ox.drawImage(b,0,0,W,H);
  const d=x.getImageData(0,0,W,H),a=d.data,k=ox.getImageData(0,0,W,H).data;
  for(let i=0;i<a.length;i+=4){
    const r=a[i]/Math.max(k[i],1),g=a[i+1]/Math.max(k[i+1],1),bl=a[i+2]/Math.max(k[i+2],1);
    if(mode===1){a[i]=lv((r-.55)/.4);a[i+1]=lv((g-.55)/.4);a[i+2]=lv((bl-.55)/.4)}
    else{const v=lv(((.299*r+.587*g+.114*bl)-.62)/.2);a[i]=a[i+1]=a[i+2]=v}
  }
  x.putImageData(d,0,0);
}

function render(p,max){
  const s=Math.min(1,max/Math.max(p.src.width,p.src.height)),w=Math.round(p.src.width*s),h=Math.round(p.src.height*s),sw=p.rot%180!==0;
  const c=document.createElement('canvas');c.width=sw?h:w;c.height=sw?w:h;
  const x=c.getContext('2d',{willReadFrequently:true});
  x.translate(c.width/2,c.height/2);x.rotate(p.rot*Math.PI/180);x.imageSmoothingQuality='high';
  x.drawImage(p.src,-w/2,-h/2,w,h);x.setTransform(1,0,0,1,0,0);
  if(p.f)enhance(c,x,p.f);
  return c;
}

function draw(){
  const g=$('#grid'),n=pages.length;
  $('#empty').hidden=n>0;$('#tools').hidden=!n;$('#dock').hidden=!n;
  $('#cnt').textContent='Các trang ('+n+')';
  $('#go').textContent='Tạo PDF · '+n+' trang';
  g.innerHTML='';
  pages.forEach((p,i)=>{
    if(!p.th)p.th=render(p,360).toDataURL('image/jpeg',.82);
    const d=document.createElement('div');d.className='card';
    d.innerHTML='<div class="th" data-a="view" data-i="'+i+'"><img src="'+p.th+'" alt="Trang '+(i+1)+'"><span class="n">'+(i+1)+'</span><span class="t">'+FN[p.f]+'</span></div>'
    +'<div class="bar">'
    +'<button data-a="l" data-i="'+i+'" aria-label="Đưa lên trước"'+(i?'':' disabled')+'>‹</button>'
    +'<button data-a="r" data-i="'+i+'" aria-label="Đưa ra sau"'+(i<n-1?'':' disabled')+'>›</button>'
    +'<button data-a="rot" data-i="'+i+'" aria-label="Xoay">⟳</button>'
    +'<button data-a="fx" data-i="'+i+'" aria-label="Đổi bộ lọc">✦</button>'
    +'<button class="x" data-a="del" data-i="'+i+'" aria-label="Xóa trang">✕</button></div>';
    g.append(d);
  });
}

$('#grid').onclick=e=>{
  const b=e.target.closest('[data-a]');if(!b)return;
  const i=+b.dataset.i,p=pages[i],a=b.dataset.a;
  if(a==='del')pages.splice(i,1);
  else if(a==='l'||a==='r'){const j=a==='l'?i-1:i+1;if(j<0||j>=pages.length)return;const t=pages[i];pages[i]=pages[j];pages[j]=t}
  else if(a==='rot'){p.rot=(p.rot+90)%360;p.th=null}
  else if(a==='fx'){p.f=(p.f+1)%3;p.th=null}
  else if(a==='view'){$('#lb img').src=render(p,1100).toDataURL('image/jpeg',.9);$('#lb').hidden=false;return}
  draw();
};
$('#lb').onclick=()=>$('#lb').hidden=true;
$('#clr').onclick=()=>{if(confirm('Xóa tất cả các trang?')){pages=[];draw()}};
$('#sz').onclick=e=>{const b=e.target.closest('button');if(!b)return;size=b.dataset.v;[...$('#sz').children].forEach(x=>x.setAttribute('aria-pressed',x===b))};
$('#bCam').onclick=()=>$('#cam').click();
$('#bPick').onclick=()=>$('#pick').click();
$('#bPdf').onclick=()=>$('#pdfIn').click();
$('#pdfIn').onchange=async e=>{const f=[...e.target.files];e.target.value='';for(const x of f)await addPdf(x)};

let pdfReady;
function loadJS(u){return new Promise((ok,no)=>{const s=document.createElement('script');s.src=u;s.onload=ok;s.onerror=no;document.head.append(s)})}
function pdfLib(){return pdfReady||(pdfReady=(async()=>{
  const B='lib/';
  await loadJS(B+'pdf.min.js');await loadJS(B+'pdf.worker.min.js');
  pdfjsLib.GlobalWorkerOptions.workerSrc=B+'pdf.worker.min.js';
  return pdfjsLib})().catch(e=>{pdfReady=null;throw e}))}
async function addPdf(file){
  toast('Đang mở PDF…');
  try{
    const lib=await pdfLib(),pdf=await lib.getDocument({data:await file.arrayBuffer()}).promise,N=Math.min(pdf.numPages,60);
    for(let n=1;n<=N;n++){
      const pg=await pdf.getPage(n),v0=pg.getViewport({scale:1}),v=pg.getViewport({scale:Math.min(3,MAXD/Math.max(v0.width,v0.height))});
      const c=document.createElement('canvas');c.width=Math.round(v.width);c.height=Math.round(v.height);
      const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);
      await pg.render({canvasContext:x,viewport:v}).promise;
      pages.push({id:++uid,src:c,rot:0,f:0,th:null});
    }
    draw();
    toast(pdf.numPages>N?'Đã thêm '+N+' trang đầu (tối đa 60 trang mỗi file)':'Đã thêm '+N+' trang');
  }catch(e){toast('Không mở được file PDF này')}
}
$('#cam').onchange=async e=>{const f=[...e.target.files];e.target.value='';if(f.length)await add(f,1)};
$('#pick').onchange=async e=>{const f=[...e.target.files];e.target.value='';if(f.length)await add(f,0)};

async function saveFile(name,blob){
  const C=window.Capacitor;
  if(C&&C.isNativePlatform&&C.isNativePlatform()){
    const {Filesystem,Share}=C.Plugins;
    const b64=await new Promise((ok,no)=>{const f=new FileReader();f.onload=()=>ok(f.result.split(',')[1]);f.onerror=no;f.readAsDataURL(blob)});
    const w=await Filesystem.writeFile({path:name,data:b64,directory:'CACHE'});
    await Share.share({title:name,url:w.uri,dialogTitle:'Lưu hoặc chia sẻ PDF'});
  }else{
    const u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),4000);
  }
}
async function make(){
  if(!pages.length||busy)return;
  busy=true;const go=$('#go');go.disabled=true;go.textContent='Đang tạo PDF…';
  await new Promise(r=>setTimeout(r,40));
  try{
    const J=window.jspdf.jsPDF;let doc=null;
    for(const p of pages){
      const c=render(p,1700),r=c.height/c.width,jpg=c.toDataURL('image/jpeg',.88);
      let W,H,m=0;
      if(size==='a4'){const land=c.width>c.height;W=land?297:210;H=land?210:297;m=6}else{W=210;H=210*r}
      const o=W>H?'l':'p';
      if(!doc)doc=new J({unit:'mm',format:[W,H],orientation:o,compress:true});else doc.addPage([W,H],o);
      let w=W-2*m,h=w*r;if(h>H-2*m){h=H-2*m;w=h/r}
      doc.addImage(jpg,'JPEG',(W-w)/2,(H-h)/2,w,h);
      await new Promise(r=>setTimeout(r,0));
    }
    const nm=($('#nm').value.trim()||'Tai-lieu-'+new Date().toISOString().slice(0,10)).replace(/[\\\/:*?"<>|]/g,'-');
    const blob=doc.output('blob');
    try{await saveFile(nm+'.pdf',blob);toast('Đã tạo PDF ✓')}catch(e){if(!/cancel/i.test(String(e&&e.message||e)))toast('Không lưu được, thử lại nhé')}
  }catch(e){toast('Có lỗi khi tạo PDF')}
  busy=false;go.disabled=false;go.textContent='Tạo PDF · '+pages.length+' trang';
}
$('#go').onclick=make;
</script>
</body></html>
